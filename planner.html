<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일정 빌더 — Resonate Tour</title>
<style>
:root{--navy:#16213e;--navy2:#1f2f52;--gold:#b08d3f;--line:#e3e6ec;--mut:#6b7280;--bg:#f6f7f9;--card:#fff;--ink:#111}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{margin:0;font-size:18px;letter-spacing:-.01em}
header p{margin:4px 0 0;font-size:12px;color:#c9d2e3;max-width:640px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 64px;display:grid;grid-template-columns:320px 1fr;gap:18px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-size:12px;letter-spacing:.08em;color:var(--mut);margin:0 0 10px;text-transform:uppercase}
.grp{margin-bottom:16px}.grp:last-child{margin-bottom:0}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--navy)}
.chk small{color:var(--mut);font-size:11px}
.slider{width:100%;accent-color:var(--navy)}
.val{font-weight:700;color:var(--navy)}
.row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:6px 0;gap:10px}
.switch{position:relative;width:42px;height:24px;background:#d7dbe3;border-radius:99px;transition:.2s;flex:none}
.switch.on{background:var(--navy)}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.switch.on i{left:21px}
button.primary{width:100%;border:none;background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:13px;border-radius:10px;cursor:pointer;font-family:inherit}
button.primary:hover{background:var(--navy2)}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;color:var(--navy)}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.day-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.day-n{background:var(--navy);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px}
.zone{font-size:11px;border:1px solid var(--gold);color:#8a6d1f;border-radius:99px;padding:2px 8px}
.day ul{margin:0;padding-left:18px;font-size:13.5px}
.day li{margin:3px 0}
.day li b{color:var(--navy)}
.day li .desc{font-size:12px;color:#6b7280;margin-top:2px;line-height:1.5}
.meta{font-size:12px;color:var(--mut);margin-top:8px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mut);font-size:13px}
.note{font-size:11.5px;color:var(--mut);margin-top:14px}
.badge{display:inline-block;font-size:10.5px;background:#eef1f7;color:var(--navy);border-radius:5px;padding:1px 6px;margin-left:4px}
</style>
</head>
<body>
<header>
 <div>
  <h1 id="hTitle">일정 빌더</h1>
  <p id="hSub">선택하신 조건에 맞춰 여정의 큰 그림을 제안합니다. 실제 예약 가능 여부와 요금은 상담 후 확정됩니다.</p>
 </div>
</header>

<div class="wrap">
 <aside class="panel">
  <div class="grp"><h2 id="lZones">지역</h2><div id="zones"></div></div>
  <div class="grp"><h2 id="lCats">액티비티 유형</h2><div id="cats"></div></div>
  <div class="grp"><h2 id="lSeasons">계절</h2><div id="seasons"></div></div>
  <div class="grp">
   <h2 id="lStay">숙박</h2>
   <div class="row"><span id="lNights" style="display:none"></span><span class="val"><span id="nightsV">6</span><span id="nUnit">박</span> <span id="daysV">8</span><span id="dUnit">일</span></span></div>
   <input class="slider" type="range" id="nights" min="2" max="23" value="6" step="1">
   <div class="row" style="margin-top:10px"><span id="lRounds">골프 라운드</span><span class="val"><span id="roundsV">3</span><span id="rUnit">회</span></span></div>
   <input class="slider" type="range" id="rounds" min="0" max="20" value="3" step="1">
   <div class="toggle"><span id="lRepeat">같은 골프코스 재방문 허용</span><span class="switch on" id="repeat"><i></i></span></div>
  </div>
  <div class="grp">
   <h2 id="lPersona">성향(선택)</h2>
   <select id="persona" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;background:#fff"></select>
  </div>
  <button class="primary" id="go">일정 만들기</button>
 </aside>

 <main>
  <div class="summary" id="summary"></div>
  <div id="out"></div>
  <p class="note" id="footNote">※ 실제 예약 가능 여부·그린피·티타임은 상담 후 확정됩니다.</p>
 </main>
</div>

const ACTS = [
  {n:'Bestia',c:'dining',z:'LA',p:['food'],note:{ko:'Arts District 이탈리안',en:'Italian, Arts District'},d:{ko:'수제 파스타와 오픈 키친으로 LA 다이닝 신을 연 곳. 저녁 예약은 몇 주 전에 마감되는 미슐랭급 인기.',en:'Handmade pasta and an open kitchen that helped define modern LA dining; dinner books out weeks ahead.'},book:true},
  {n:'Providence',c:'dining',z:'LA',p:['food'],note:{ko:'미쉐린 2스타',en:'Two Michelin stars'},d:{ko:'할리우드의 해산물 코스 요리. 신선한 해산물을 파인다이닝으로 풀어내는 LA 대표 스페셜 오케이션 레스토랑.',en:'Seafood tasting menu in Hollywood — a go-to special-occasion room for beautifully handled fish.'},book:true},
  {n:'Holbox',c:'dining',z:'LA',p:['food'],note:{ko:'DTLA 멕시칸 해산물',en:'Mexican seafood, DTLA'},d:{ko:'머카도 안 작은 카운터지만 미쉐린 스타를 받은 유카탄식 해산물. 세비체와 토스타다가 시그니처.',en:'A tiny counter inside a market with a Michelin star for Yucatán-style seafood; ceviche and tostadas are the signatures.'}},
  {n:'Guelaguetza',c:'dining',z:'LA',p:['food'],note:{ko:'코리아타운 오악사카',en:'Oaxacan, Koreatown'},d:{ko:'1994년부터 이어진 오악사카 전통 음식점. 몰레와 타말레, 라이브 마리아치로 유명.',en:'Oaxacan institution since 1994 — famous for mole, tamales and live mariachi.'}},
  {n:'Sushi Gen',c:'dining',z:'LA',p:['food'],note:{ko:'리틀도쿄 노포 스시',en:'Old-school sushi, Little Tokyo'},d:{ko:'현지인이 줄 서는 오래된 스시야. 런치 스시가 가성비로 유명하고 일본어 응대가 오가는 동네 분위기.',en:'A venerable sushi bar where locals queue; the lunch set is famous for value.'}},
  {n:'Musso & Frank Grill',c:'dining',z:'LA',p:['calm'],note:{ko:'1919년 할리우드 클래식',en:'Hollywood classic since 1919'},d:{ko:'할리우드에서 가장 오래된 그릴. 붉은 가죽 부스와 웨이터 복장 그대로인, 영화 같은 식사 경험.',en:'Hollywood’s oldest grill — red leather booths and waiters in uniform for a film-set meal.'},book:true},
  {n:'Grand Central Market',c:'dining',z:'LA',p:['food'],note:{ko:'1917년 푸드홀',en:'Food hall since 1917'},d:{ko:'다운타운의 100년 된 시장. 타코부터 커피까지 40여 개 스톨을 한 번에 둘러볼 수 있는 곳.',en:'A century-old downtown market with 40+ stalls, from tacos to coffee.'}},
  {n:'Getty Center',c:'landmark',z:'LA',p:['calm','scenic'],note:{ko:'언덕 위 미술관',en:'Hilltop museum'},d:{ko:'리처드 마이어 설계의 흰 건물과 정원, LA 전경. 무료 입장이지만 주차 예약이 필요해.',en:'Richard Meier’s white hilltop campus with gardens and sweeping LA views; free entry, reserve parking.'}},

  {n:'Santa Monica Pier',c:'landmark',z:'LA',p:['scenic'],note:{ko:'1909년 부두',en:'Pier since 1909'},d:{ko:'퍼시픽 파크 놀이공원과 태평양 일몰. LA 여행의 마무리 산책 코스로 적당.',en:'Pacific Park rides and ocean sunsets — a good closing stroll for an LA trip.'}},
  {n:'The Huntington',c:'nature',z:'LA',p:['calm'],note:{ko:'120에이커 정원',en:'120-acre gardens'},d:{ko:'사막·일본·중국 정원과 구텐베르크 성경이 있는 도서관. 반나절 산책에 좋아.',en:'Desert, Japanese and Chinese gardens plus a Gutenberg Bible; an easy half-day walk.'}},

  {n:'George’s at the Cove',c:'dining',z:'SD',p:['food','scenic'],note:{ko:'라호야 오션뷰',en:'Ocean view, La Jolla'},d:{ko:'1981년부터 이어진 라호야 해안 레스토랑. 루프탑 테라스에서 태평양을 보며 식사하는 곳.',en:'A La Jolla oceanfront fixture since 1981, with a rooftop terrace over the Pacific.'},book:true},
  {n:'Juniper & Ivy',c:'dining',z:'SD',p:['food'],note:{ko:'리틀 이탈리 파인다이닝',en:'Fine dining, Little Italy'},d:{ko:'Top Chef 출신 셰프의 모던 아메리칸. 샌디에이고 파인다이닝 씬을 대표하는 곳.',en:'Modern American from a Top Chef alum — a flagship of San Diego fine dining.'},book:true},

  {n:'Las Cuatro Milpas',c:'dining',z:'SD',p:['food'],note:{ko:'1933년 타코',en:'Tacos since 1933'},d:{ko:'바리오 로건의 노포. 손으로 빚는 토르티야와 카르니타스로 현지인 줄이 끊이지 않아.',en:'A Barrio Logan institution — hand-pressed tortillas and carnitas, with a constant local line.'}},
  {n:'Hodad’s',c:'dining',z:'SD',p:['food'],note:{ko:'오션비치 버거',en:'Burgers, Ocean Beach'},d:{ko:'1969년부터 이어진 버거 명물. 두툼한 패티와 서핑 분위기로 관광객도 많이 찾아.',en:'A burger landmark since 1969 — thick patties and surf-town atmosphere.'}},
  {n:'Coronado Beach',c:'landmark',z:'SD',p:['scenic','calm'],note:{ko:'코로나도 해변',en:'Coronado Beach'},d:{ko:'미국 최고 해변 목록에 자주 오르는 백사장. 1888년 호텔 델 코로나도가 상징.',en:'A white-sand strand often ranked among America’s best, anchored by the 1888 Hotel del Coronado.'}},
  {n:'Balboa Park',c:'landmark',z:'SD',p:['calm'],note:{ko:'박물관 공원',en:'Museum park'},d:{ko:'17개 박물관과 정원, 샌디에이고 동물원이 모인 공원. 하루로도 부족한 규모.',en:'17 museums, gardens and the San Diego Zoo in one park — a full day at least.'}},
  {n:'Torrey Pines State Reserve',c:'nature',z:'SD',p:['scenic','active'],note:{ko:'희귀 소나무 해안',en:'Rare pines, coastal'},d:{ko:'세계에서 희귀한 토리 소나무 군락과 절벽 트레일. 바다를 따라 걷는 코스가 압권.',en:'A rare Torrey pine grove with cliffside trails above the ocean.'}},
  {n:'La Jolla Cove Kayak',c:'exp',z:'SD',p:['active'],note:{ko:'해양보호구역 카약',en:'Kayak in a marine reserve'},d:{ko:'바다사자와 동굴을 지나는 카약·스노클. 물놀이를 좋아하면 만족도가 높은 체험.',en:'Paddle past sea lions and sea caves in a protected cove.'},book:true},
  {n:'Wilson Creek Winery',c:'wine',z:'TM',p:['food'],note:{ko:'테메큘라 대표 와이너리',en:'Temecula winery'},d:{ko:'알몬드 샴페인으로 유명한 가족 와이너리. 잔디마당에서 피크닉하듯 와인을 즐길 수 있어.',en:'A family winery known for Almond Champagne; drink on the lawn like a picnic.'}},
  {n:'Callaway Vineyard',c:'wine',z:'TM',p:['food'],note:{ko:'테메큘라 첫 와이너리',en:'Temecula’s first winery'},d:{ko:'1969년 테메큘라 와인 역사를 연 곳. 언덕 위 테라스에서 계곡 뷰를 보며 시음.',en:'Temecula’s first winery (1969), with a hilltop terrace over the valley.'},book:true},
  {n:'South Coast Winery',c:'wine',z:'TM',p:['food','calm'],note:{ko:'리조트형 와이너리',en:'Winery resort'},d:{ko:'와이너리·리조트·스파가 함께 있는 곳. 라운드 후 숙박까지 연결하기 좋아.',en:'Winery, resort and spa in one — easy to pair with an overnight.'},book:true},
  {n:'Old Town Temecula',c:'landmark',z:'TM',p:['calm'],note:{ko:'1880년대 서부 마을',en:'1880s western town'},d:{ko:'목조 건물 거리에 상점과 바, 주말 라이브 음악. 저녁 산책 겸 한 끼 하기 좋아.',en:'Wooden storefronts, shops, bars and weekend live music.'}},
  {n:'Pechanga Resort',c:'exp',z:'TM',p:['active'],note:{ko:'대형 리조트 카지노',en:'Resort casino'},d:{ko:'카지노·스파·공연장을 갖춘 리조트. 골프장(Journey)과 붙어 있어 동선이 편해.',en:'Casino, spa and shows — next door to Journey at Pechanga.'}},
  {n:'Temecula Balloon Ride',c:'exp',z:'TM',p:['scenic','active'],note:{ko:'새벽 열기구',en:'Sunrise balloon'},d:{ko:'해 뜨기 전 와이너리 위를 나는 열기구. 테메큘라에서만 가능한 대표 체험.',en:'Pre-dawn balloon flights over the vineyards.'},book:true},
  {n:'Melvyn’s',c:'dining',z:'PS',p:['calm','food'],note:{ko:'1975년 올드할리우드',en:'Old Hollywood, 1975'},d:{ko:'잉글사이드 인의 클래식 레스토랑. 프랭크 시나트라가 드나들던 분위기 그대로.',en:'The classic room at the Ingleside Inn, still channeling Sinatra-era Palm Springs.'},book:true},
  {n:'Workshop Kitchen + Bar',c:'dining',z:'PS',p:['food'],note:{ko:'모던 아메리칸',en:'Modern American'},d:{ko:'미드센추리 건축 공간의 파인다이닝. 팜스프링스에서 가장 세련된 저녁 중 하나.',en:'Modern American in a mid-century space — one of the desert’s most polished dinners.'},book:true},
  {n:'El Paseo',c:'dining',z:'PS',p:['food'],note:{ko:'팜데저트의 로데오',en:'Palm Desert’s Rodeo Drive'},d:{ko:'갤러리·부티크·레스토랑이 늘어선 거리. 쇼핑과 식사를 한 번에 해결.',en:'Galleries, boutiques and restaurants in one stretch.'}},
  {n:'Shield’s Date Garden',c:'dining',z:'PS',p:['food'],note:{ko:'1924년 데이트 농장',en:'Date farm since 1924'},d:{ko:'데이트 셰이크의 원조격. 사막 여행 중 잠깐 들러 마시는 디저트로 유명.',en:'The original date shake, from a 1924 date farm.'}},
  {n:'Palm Springs Aerial Tramway',c:'landmark',z:'PS',p:['scenic'],note:{ko:'회전 케이블카',en:'Rotating tramway'},d:{ko:'세계 최대 회전식 케이블카로 산정 2,600m까지. 사막과 계곡을 한 번에 내려다봐.',en:'The world’s largest rotating tramcar climbs to 8,500 ft for desert-to-valley views.'}},
  {n:'Joshua Tree National Park',c:'nature',z:'PS',p:['scenic','active'],note:{ko:'사막 국립공원',en:'Desert national park'},d:{ko:'기암과 조슈아 트리, 밤하늘 별보기로 유명. 팜스프링스에서 차로 1시간.',en:'Boulders, Joshua trees and dark-sky stargazing, an hour from Palm Springs.'}},
  {n:'Palm Canyon Drive',c:'landmark',z:'PS',p:['calm'],note:{ko:'다운타운 팜스프링스',en:'Downtown Palm Springs'},d:{ko:'미드센추리 건축과 부티크가 이어지는 중심 거리. 저녁 산책과 사진 찍기 좋아.',en:'Mid-century architecture, boutiques and cafés along the main strip.'}}
];

/* ---------- state ---------- */
const _qp = new URLSearchParams(location.search);
const _pParam = _qp.get('p');
const _PERSONAS = ['scenic','food','active','calm'];
const state = { zones:new Set(Object.keys(ZONES)), cats:new Set(CATS.map(c=>c.id)),
  seasons:new Set(['spring','fall']), nights:6, rounds:3, repeat:true,
  persona: (_PERSONAS.includes(_pParam) ? _pParam : '') };

/* ---------- UI ---------- */
const $ = s => document.querySelector(s);
const zname = z => ZONES[z][lang] || ZONES[z].ko;

function applyStatic() {
  var hEl=$('#hTitle'); hEl.textContent='';
  var titleTxt=t('title');
  var m=titleTxt.split(' — ');
  var mainSpan=document.createElement('span'); mainSpan.textContent=m[0]; hEl.appendChild(mainSpan);
  if(m[1]){ var sub=document.createElement('span'); sub.style.cssText='font-weight:400;opacity:.7'; sub.textContent=' — '+m[1]; hEl.appendChild(sub); }
  $('#hSub').textContent = t('sub');
  $('#lZones').textContent = t('zones'); $('#lCats').textContent = t('cats'); $('#lSeasons').textContent = t('seasons');
  $('#lStay').textContent = t('stay'); var _ln=$('#lNights'); if(_ln) _ln.textContent = t('nights'); $('#lRounds').textContent = t('rounds');
  $('#lRepeat').textContent = t('repeat'); $('#lPersona').textContent = t('persona'); $('#go').textContent = t('go');
  $('#footNote').textContent = t('notes');
  $('#nUnit').textContent = t('unitN'); $('#dUnit').textContent = t('unitD'); $('#rUnit').textContent = t('unitR');
  const sel = $('#persona');
  sel.replaceChildren();
  [['','p0'],['scenic','pScenic'],['food','pFood'],['active','pActive'],['calm','pCalm']].forEach(([v,k])=>{
    const o=document.createElement('option'); o.value=v; o.textContent=t(k); sel.appendChild(o);
  });
  sel.value = state.persona;
  document.documentElement.lang = lang;
}

function mkChk(label, checked, onChange, sub){
  const l=document.createElement('label'); l.className='chk';
  const i=document.createElement('input'); i.type='checkbox'; i.checked=checked; i.onchange=()=>onChange(i.checked);
  const s=document.createElement('span'); s.textContent=label; l.appendChild(i); l.appendChild(s);
  if(sub){const sm=document.createElement('small'); sm.textContent=sub; l.appendChild(sm);}
  return l;
}
function renderControls(){
  const z=$('#zones'); z.replaceChildren();
  Object.entries(ZONES).forEach(([k,v])=>z.appendChild(mkChk(`${v[lang]} (${v.short})`, state.zones.has(k), on=>{on?state.zones.add(k):state.zones.delete(k);})));
  const c=$('#cats'); c.replaceChildren();
  CATS.forEach(cat=>c.appendChild(mkChk(t(cat.key), state.cats.has(cat.id), on=>{on?state.cats.add(cat.id):state.cats.delete(cat.id);})));
  const s=$('#seasons'); s.replaceChildren();
  SEASONS.forEach(se=>s.appendChild(mkChk(t(se.k), state.seasons.has(se.id), on=>{on?state.seasons.add(se.id):state.seasons.delete(se.id);})));
  $('#nights').value=state.nights; $('#rounds').value=state.rounds;
  $('#nightsV').textContent=state.nights; $('#daysV').textContent=state.nights+2; $('#roundsV').textContent=state.rounds;
  $('#repeat').classList.toggle('on', state.repeat);
}
$('#nights').oninput=e=>{state.nights=+e.target.value; $('#nightsV').textContent=state.nights; $('#daysV').textContent=state.nights+2;};
$('#rounds').oninput=e=>{state.rounds=+e.target.value; $('#roundsV').textContent=state.rounds;};
$('#repeat').onclick=()=>{state.repeat=!state.repeat; $('#repeat').classList.toggle('on',state.repeat);};
$('#persona').onchange=e=>{state.persona=e.target.value;};
$('#go').onclick=build;
function toggleLang(){ lang = lang==='ko'?'en':'ko'; try{localStorage.setItem(LANG_KEY, lang);}catch(e){} applyStatic(); renderControls(); build(); }

function scoreAct(a){
  let s=0;
  if(state.cats.has(a.c)) s+=2;
  if(state.persona && a.p.includes(state.persona)) s+=3;
  if(a.z==='PS' && state.seasons.has('summer')) s-=4;
  return s;
}
function pickActs(zone, used, n, fallback){
  const order=[zone, ...(fallback||[]).filter(z=>z!==zone)];
  const out=[];
  for(const z of order){
    const cand=ACTS.filter(a=>a.z===z && !used.has(a.n)).map(a=>({a,s:scoreAct(a)+(z===zone?0:-0.5)+Math.random()*0.4})).sort((x,y)=>y.s-x.s);
    for(const c of cand){ if(out.length>=n) break; out.push(c.a); used.add(c.a.n); }
    if(out.length>=n) break;
  }
  return out;
}

function emptyBox(msg){ var d=document.createElement('div'); d.className='empty'; d.textContent=msg; return d; }
function build(){
  const days=state.nights+2;
  const zones=[...state.zones];
  const out=$('#out'); out.replaceChildren();
  const sum=$('#summary'); sum.replaceChildren();
  if(!zones.length){ out.appendChild(emptyBox(t('noZone'))); return; }

  const courseScore=c=>(state.persona && c.p.includes(state.persona)?2:0)+(c.p.includes('scenic')&&!state.persona?1:0);
  const availCourses=COURSES.filter(c=>state.zones.has(c.zone)).sort((a,b)=>courseScore(b)-courseScore(a));
  if(!availCourses.length){ out.appendChild(emptyBox(t('noCourse'))); return; }

  const rounds=Math.min(state.rounds, Math.max(0,days-2), 20);
  const courseZones=[...new Set(availCourses.map(c=>c.zone))];
  const maxZones=Math.max(1, Math.min(5, Math.ceil(days/3)));
  let planZones=(courseZones.length?courseZones:zones).filter(z=>state.zones.has(z));
  if(!planZones.length) planZones=zones.slice();
  const cnt={}; availCourses.forEach(c=>cnt[c.zone]=(cnt[c.zone]||0)+1);
  planZones.sort((a,b)=>(cnt[b]||0)-(cnt[a]||0));
  planZones=planZones.slice(0,maxZones);

  // 균등 분산
  const middles=[]; for(let d=1;d<days-1;d++) middles.push(d);
  const golfDaySet=new Set();
  if(rounds>0 && middles.length){
    if(rounds>=middles.length) middles.forEach(d=>golfDaySet.add(d));
    else{
      const step=middles.length/rounds, pick=[];
      for(let i=0;i<rounds;i++){
        let idx=Math.round(i*step+step/2-0.5);
        idx=Math.max(0,Math.min(middles.length-1,idx));
        const d=middles[idx];
        if(!pick.includes(d)) pick.push(d);
      }
      for(const d of middles){ if(pick.length>=rounds) break; if(!pick.includes(d)) pick.push(d); }
      pick.slice(0,rounds).forEach(d=>golfDaySet.add(d));
      let arr=[...golfDaySet].sort((a,b)=>a-b);
      for(let i=0;i<arr.length-1;i++){
        if(arr[i+1]-arr[i]===1){
          const free=middles.filter(d=>!golfDaySet.has(d)&&!golfDaySet.has(d-1)&&!golfDaySet.has(d+1));
          if(free.length){
            free.sort((a,b)=>Math.abs(a-arr[i+1])-Math.abs(b-arr[i+1]));
            golfDaySet.delete(arr[i+1]); golfDaySet.add(free[0]);
            arr=[...golfDaySet].sort((a,b)=>a-b); i=-1;
          }
        }
      }
    }
  }

  const usedActs=new Set(), usedCourses=new Set(), courseCount={};
  let prevZone=null, driveTotal=0, golfUsed=0;
  const rows=[];
  for(let d=0;d<days;d++){
    const isFirst=d===0, isLast=d===days-1;
    const blockLen=Math.max(1, Math.floor((days-2)/Math.max(1,planZones.length)));
    const zi=(isFirst||isLast)?0:Math.min(planZones.length-1, Math.floor((d-1)/blockLen));
    const zone=planZones[zi]||planZones[0];
    const items=[];
    if(isFirst){
      items.push({txt:fmt(t('arrival'),{z:zname(zone)}),k:'move'});
      items.push({txt:t('checkin'),k:'rest'});
    } else if(isLast){
      items.push({txt:t('checkout'),k:'rest'});
      items.push({txt:t('depart'),k:'move'});
    } else {
      let c=null;
      if(golfDaySet.has(d)){
        // 1) 같은 지역의 미사용 코스 → 2) 다른 지역 미사용 코스
        c=availCourses.find(x=>x.zone===zone && !usedCourses.has(x.id));
        if(!c) c=availCourses.find(x=>!usedCourses.has(x.id));
        // 3) 재방문: 토글 + 10박 이상일 때만, 코스당 최대 2회
        if(!c && state.repeat && state.nights>=10){
          c=availCourses.filter(x=>(courseCount[x.id]||0)<2)
                        .sort((a,b)=>(courseCount[a.id]||0)-(courseCount[b.id]||0))[0]||null;
        }
        if(c){
          golfUsed++; usedCourses.add(c.id); courseCount[c.id]=(courseCount[c.id]||0)+1;
          items.push({txt:fmt(t('golf'),{c:c.name}),k:'golf',tag:c.tag[lang],note:null});
        }
      }
      // 골프만 하고 끝나지 않도록: 골프일에도 액티비티 2개를 채운다
      const nAct=2;
      pickActs(zone, usedActs, nAct, planZones).forEach(a=>{
        items.push({txt:a.n,k:a.c,note:a.note[lang],d:a.d[lang],book:a.book});
      });
      if(!items.length) items.push({txt:t('free'),k:'rest'});
    }
    const dz=prevZone?((ZONES[prevZone].drive||{})[zone]||0):0;
    driveTotal+=dz; prevZone=zone;
    rows.push({d,zone,items,dz});
  }
  const pills=[
    fmt(t('sumNights'),{n:state.nights,d:days}),
    fmt(t('sumRounds'),{n:golfUsed}),
    fmt(t('sumZones'),{n:planZones.length})
  ];
  pills.forEach(x=>{const p=document.createElement('span'); p.className='pill'; p.textContent=x; sum.appendChild(p);});

  rows.forEach(r=>{
    const card=document.createElement('div'); card.className='day';
    const h=document.createElement('div'); h.className='day-h';
    const n=document.createElement('span'); n.className='day-n'; n.textContent=t('day')+' '+(r.d+1);
    const z=document.createElement('span'); z.className='zone'; z.textContent=zname(r.zone);
    h.appendChild(n); h.appendChild(z); card.appendChild(h);
    const ul=document.createElement('ul');
    r.items.forEach(it=>{
      const li=document.createElement('li');
      const b=document.createElement('b'); b.textContent=it.txt; li.appendChild(b);
      if(it.tag){const t2=document.createElement('span'); t2.className='badge'; t2.textContent=it.tag; li.appendChild(t2);}
      if(it.note){const s2=document.createElement('div'); s2.className='meta'; s2.textContent=it.note; li.appendChild(s2);}
      if(it.d){const ds=document.createElement('div'); ds.className='desc'; ds.textContent=it.d; li.appendChild(ds);}
      if(it.book){const bk=document.createElement('span'); bk.className='badge'; bk.textContent=t('book'); li.appendChild(bk);}
      ul.appendChild(li);
    });
    card.appendChild(ul);
    out.appendChild(card);
  });
}

applyStatic();
renderControls();
build();
</script>
</body>
